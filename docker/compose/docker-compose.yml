services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    hostname: oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_PDB}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../oracle/initdb:/container-entrypoint-initdb.d
      - ../oracle/healthcheck/healthcheck.sh:/opt/oracle/healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/oracle/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - cdc-net

volumes:
  oracle-data:

networks:
  cdc-net:
    name: cdc-net