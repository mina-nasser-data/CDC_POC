services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    hostname: oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_PDB}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../oracle/initdb:/container-entrypoint-initdb.d
      - ../oracle/healthcheck/healthcheck.sh:/opt/oracle/healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/oracle/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - cdc-net
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - cdc-net
  connect:
      build:
        context: ../connect
        dockerfile: Dockerfile
      container_name: connect
      hostname: connect
      depends_on:
        kafka:
          condition: service_healthy
        oracle:
          condition: service_healthy
      ports:
        - "8083:8083"
      environment:
        BOOTSTRAP_SERVERS: "kafka:9092"
        GROUP_ID: "connect-cluster"

        CONFIG_STORAGE_TOPIC: "connect-configs"
        OFFSET_STORAGE_TOPIC: "connect-offsets"
        STATUS_STORAGE_TOPIC: "connect-status"

        CONFIG_STORAGE_REPLICATION_FACTOR: 1
        OFFSET_STORAGE_REPLICATION_FACTOR: 1
        STATUS_STORAGE_REPLICATION_FACTOR: 1

        KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
        KEY_CONVERTER_SCHEMAS_ENABLE: "true"
        VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

        CONNECT_REST_ADVERTISED_HOST_NAME: "connect"
        CONNECT_PLUGIN_PATH: "/kafka/connect,/kafka/connect/oracle-drivers"
      networks:
        - cdc-net
  kafdrop:
    image: obsidiandynamics/kafdrop:4.1.0
    container_name: kafdrop
    hostname: kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFDROP_PORT}:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      SERVER_SERVLET_CONTEXTPATH: "/"
    networks:
      - cdc-net

  risingwave:
    image: risingwavelabs/risingwave:v2.0.5
    container_name: risingwave
    command: single_node
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4566:4566"    # Postgres-wire SQL port
      - "5691:5691"    # meta HTTP dashboard
    environment:
      RW_SINGLE_NODE_STORE_DIRECTORY: /risingwave/data
    volumes:
      - risingwave-data:/risingwave/data
    networks:
      - cdc-net
      
  superset:
    build:
      context: ../superset
      dockerfile: Dockerfile
    container_name: superset
    hostname: superset
    depends_on:
      superset-db:
        condition: service_started
      risingwave:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "cdc-poc-secret-key-change-me"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://superset:superset@superset-db:5432/superset"
      SUPERSET_LOAD_EXAMPLES: "no"
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username admin \
          --firstname Superset \
          --lastname Admin \
          --email admin@superset.local \
          --password admin || true &&
        superset init &&
        gunicorn \
          --bind 0.0.0.0:8088 \
          --workers 2 \
          --timeout 120 \
          "superset.app:create_app()"
    networks:
      - cdc-net

# Meta-Data db for Superset
  superset-db:
    image: postgres:16
    container_name: superset-db
    hostname: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks:
      - cdc-net

volumes:
  oracle-data:
  kafka-data:
  risingwave-data:
  superset-db-data:
  postgres-data:
networks:
  cdc-net:
    name: cdc-net