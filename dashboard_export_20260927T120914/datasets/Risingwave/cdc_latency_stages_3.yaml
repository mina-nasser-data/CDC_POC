  \ WHERE op = 'c'\r\nUNION ALL\r\nSELECT rw_echo_ts, entry_id, '3 kafka \u2192 risingwave',\r\
  \n       kafka_to_risingwave_ms::BIGINT\r\nFROM cdc_stmt_entry_latency_full WHERE\
  \ op = 'c'\r\n"
