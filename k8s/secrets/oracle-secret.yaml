# Oracle credentials, sourced from the project's .env (matches docker-compose.yml's
# ${ORACLE_PASSWORD} substitution) and from the hardcoded values in
# docker/oracle/initdb/02-configure-cdc.sql and 03-create-app-schema.sql.
apiVersion: v1
kind: Secret
metadata:
  name: oracle-secret
  namespace: cdc-scb
type: Opaque
stringData:
  # System/admin password used by the healthcheck and by ORACLE_PASSWORD in docker-compose.yml
  ORACLE_PASSWORD: "OraclePass123"
  # APPUSER application-schema credentials (hardcoded today in 03-create-app-schema.sql)
  ORACLE_APP_USER: "APPUSER"
  ORACLE_APP_PASSWORD: "AppUserPass123"
  # C##DBZUSER Debezium/LogMiner connector credentials (hardcoded today in 02-configure-cdc.sql)
  ORACLE_CONNECTOR_USER: "C##DBZUSER"
  ORACLE_CONNECTOR_PASSWORD: "DbzUserPass123"
