# PostgreSQL credentials, matching docker-compose.yml's ${POSTGRES_DB}/${POSTGRES_USER}/${POSTGRES_PASSWORD}
# substitution and the values used in docker/connect/connectors/postgres-source.json.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cdc-scb
type: Opaque
stringData:
  POSTGRES_DB: "cdcdb"
  POSTGRES_USER: "cdcuser"
  POSTGRES_PASSWORD: "CdcUserPass123"
