# Superset credentials. Values match docker-compose.yml's superset service block, which hardcodes
# these directly in its `environment:`/`command:` (it does NOT read .env's SUPERSET_* vars -
# those are currently unused/stale; flagged separately, not treated as authoritative here).
apiVersion: v1
kind: Secret
metadata:
  name: superset-secret
  namespace: cdc-scb
type: Opaque
stringData:
  # App secret key (docker-compose.yml environment.SUPERSET_SECRET_KEY)
  SUPERSET_SECRET_KEY: "cdc-poc-secret-key-change-me"
  # Admin bootstrap user (docker-compose.yml superset `command:` block)
  SUPERSET_ADMIN_USER: "admin"
  SUPERSET_ADMIN_PASSWORD: "admin"
  SUPERSET_ADMIN_FIRSTNAME: "Superset"
  SUPERSET_ADMIN_LASTNAME: "Admin"
  SUPERSET_ADMIN_EMAIL: "admin@superset.local"
  # superset-db (metadata Postgres) credentials, hardcoded in docker-compose.yml's superset-db service
  SUPERSET_DB_USER: "superset"
  SUPERSET_DB_PASSWORD: "superset"
  SUPERSET_DB_NAME: "superset"
