# Debezium connector payloads, preserved verbatim from docker/connect/connectors/.
# Stored as a Secret (not a ConfigMap) because each payload embeds a plaintext
# database.user/database.password. Register and refresh payloads are kept
# separate and unmerged, per instruction - do not consolidate them here.
apiVersion: v1
kind: Secret
metadata:
  name: connect-secret
  namespace: cdc-scb
type: Opaque
stringData:
  # POST /connectors body - from docker/connect/connectors/oracle-source.json
  oracle-source-register.json: |
    {
      "name": "oracle-cdc-connector",
      "config": {
        "connector.class": "io.debezium.connector.oracle.OracleConnector",
        "tasks.max": "1",

        "database.hostname": "oracle",
        "database.port": "1521",
        "database.user": "C##DBZUSER",
        "database.password": "DbzUserPass123",
        "database.dbname": "xepdb1",
        "database.pdb.name": "XEPDB1",

        "topic.prefix": "T24",
        "database.connection.adapter": "logminer",

        "snapshot.mode": "initial",
        "table.include.list": "APPUSER.STMT_ENTRY",

        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "false",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",

        "include.schema.changes": "true",
        "decimal.handling.mode": "string",
        "time.precision.mode": "adaptive",

        "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
        "schema.history.internal.kafka.topic": "schemahistory.T24",

        "log.mining.continuous.mine": "true",
        "log.mining.select.all.tables": "false",
        "log.mining.include.regex.table.list": "APPUSER.STMT_ENTRY",
        "//online_catalog":"online_catalog doesn't store the dictionary information in the redo logs, less overhead and faster, Not good for tables that change it's schema frequently,",
        "//redo_log_catalog":"redo_log_catalog stores the dictionary information in the redo logs, more overhead but more comprehensive",
        "log.mining.strategy": "online_catalog",

        "lob.enabled": "true",
        "lob.chunk.size": "102400",
        "lob.erase.poll.interval.ms": "0",

        "database.fetch.size": "5000",
        "jdbc.lob.chunk.size": "102400",
        "jdbc.batch.size": "20000",
        "binary.handling.mode": "base64",


        "include.unknown.datatypes": "true",
        "post.processors": "reselectColumns",
        "post.processors.reselectColumns.type": "io.debezium.processors.reselect.ReselectColumnsPostProcessor",
        "post.processors.reselectColumns.reselect.columns.include.list": "APPUSER.STMT_ENTRY:TXN_METADATA,APPUSER.STMT_ENTRY:AUDIT_TRAIL,APPUSER.STMT_ENTRY:DIGITAL_RECEIPT,APPUSER.STMT_ENTRY:TXN_METADATA_BINARY",

        "provide.transaction.metadata": "false",
        "snapshot.locking.mode": "none"
      }
    }
  # PUT /connectors/oracle-cdc-connector/config body - from docker/connect/connectors/oracle-source-config-only.json
  oracle-source-refresh.json: |
    {
     "connector.class": "io.debezium.connector.oracle.OracleConnector",
        "tasks.max": "1",

        "database.hostname": "oracle",
        "database.port": "1521",
        "database.user": "C##DBZUSER",
        "database.password": "DbzUserPass123",
        "database.dbname": "xepdb1",
        "database.pdb.name": "XEPDB1",

        "topic.prefix": "T24",
        "database.connection.adapter": "logminer",

        "snapshot.mode": "initial",
        "table.include.list": "APPUSER.STMT_ENTRY",

        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "false",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",

        "include.schema.changes": "true",
        "decimal.handling.mode": "precise",
        "time.precision.mode": "adaptive",

        "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
        "schema.history.internal.kafka.topic": "schemahistory.T24",

        "log.mining.continuous.mine": "true",
        "log.mining.select.all.tables": "false",
        "log.mining.include.regex.table.list": "APPUSER.STMT_ENTRY",
        "log.mining.strategy": "online_catalog",

        "lob.enabled": "true",
        "lob.chunk.size": "102400",
        "lob.erase.poll.interval.ms": "0",

        "database.fetch.size": "5000",
        "jdbc.lob.chunk.size": "102400",
        "jdbc.batch.size": "20000",
        "binary.handling.mode": "base64",

        "datatype.propagate.source.type": "APPUSER.STMT_ENTRY:TXN_METADATA",

        "include.unknown.datatypes": "true",
        "post.processors": "reselectColumns",
        "post.processors.reselectColumns.type": "io.debezium.processors.reselect.ReselectColumnsPostProcessor",
        "post.processors.reselectColumns.reselect.columns.include.list": "APPUSER.STMT_ENTRY:AUDIT_TRAIL,APPUSER.STMT_ENTRY:DIGITAL_RECEIPT",

        "provide.transaction.metadata": "false",
        "snapshot.locking.mode": "none"
    }
  # POST /connectors body - from docker/connect/connectors/postgres-source.json
  postgres-source-register.json: |
    {
      "name": "postgres-cdc-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",

        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "cdcuser",
        "database.password": "CdcUserPass123",
        "database.dbname": "cdcdb",

        "topic.prefix": "postgres16",

        "plugin.name": "pgoutput",
        "publication.name": "dbz_publication",
        "slot.name": "debezium_postgres_slot",

        "snapshot.mode": "initial",

        "table.include.list": "public.stmt_entry",

        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "false",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",

        "include.schema.changes": "false",

        "decimal.handling.mode": "double",
        "time.precision.mode": "adaptive",

        "provide.transaction.metadata": "false"
      }
    }
  # PUT /connectors/postgres-cdc-connector/config body - from docker/connect/connectors/postgres-source-config.json
  postgres-source-refresh.json: |
    {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",

        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "cdcuser",
        "database.password": "CdcUserPass123",
        "database.dbname": "cdcdb",

        "topic.prefix": "postgres16",

        "plugin.name": "pgoutput",
        "publication.name": "dbz_publication",
        "slot.name": "debezium_postgres_slot",

        "snapshot.mode": "initial",

        "table.include.list": "public.stmt_entry",

        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "false",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",

        "include.schema.changes": "false",


        "decimal.handling.mode": "double",
        "time.precision.mode": "adaptive",

        "provide.transaction.metadata": "false"
      }
